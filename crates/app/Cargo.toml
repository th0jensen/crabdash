[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
tracing.workspace = true
libghostty-vt.workspace = true
lucide-icons.workspace = true
machines.workspace = true
services.workspace = true
smol.workspace = true
utils.workspace = true
uuid.workspace = true

capitalize = "0.3.4"
unicode-segmentation = "1.12.0"
serde.workspace = true
serde_json = "1"
shell-words = "1.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { path = "../../vendor/ksni", default-features = false, features = ["async-io"] }
raw-window-handle = { version = "0.6", features = ["std"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3.2", features = ["NSDictionary", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[lints]
workspace = true

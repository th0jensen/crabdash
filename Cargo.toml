[workspace]
resolver = "2"
exclude = ["vendor/ksni", "vendor/gpui", "vendor/portable-pty"]
members = [
    "crates/app",
    "crates/crabdash",
    "crates/machines",
    "crates/services",
    "crates/tui",
    "crates/utils",
]
default-members = ["crates/crabdash"]

[workspace.package]
edition = "2024"
version = "0.1.5"
license = "MIT"
authors = ["Thomas Jensen"]
description = "Crabdash desktop app built with Rust and GPUI"
repository = "https://github.com/th0jensen/crabdash"

[workspace.dependencies]
app = { path = "crates/app" }
# Published as crabdash-* for crabdash-tui; code keeps the short crate names.
machines = { package = "crabdash-machines", path = "crates/machines", version = "=0.1.5" }
services = { package = "crabdash-services", path = "crates/services", version = "=0.1.5" }
utils = { package = "crabdash-utils", path = "crates/utils", version = "=0.1.5" }

anyhow = { version = "1.0.102", features = ["std", "backtrace"] }
gpui = { version = "=0.2.2" }
indoc = { version = "2.0.7" }
libghostty-vt = "0.2.1"
lucide-icons = { version = "0.575.0" }
portable-pty = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
smol = { version = "2.0.2" }
tracing = "=0.1.44"
tracing-subscriber = { version = "0.3.19", features=["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

# Preserve proc-macro metadata with the macOS linker, including debug=0 builds.
[profile.dev.build-override]
strip = "none"

[profile.release.build-override]
strip = "none"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[patch.crates-io]
gpui = { path = "vendor/gpui" }
libghostty-vt = { path = "vendor/libghostty-vt" }
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }
portable-pty = { path = "vendor/portable-pty" }
